<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

  <link rel="icon" href="favicon.ico" />

  <title>歌仔戲</title>

  <meta name="author" content="Neil Chen" />
  <meta name="title" content="歌仔戲" />
  <meta name="description" content="收集YouTube台灣歌仔戲相關影片。" />

  <script src="opera-list.js" type="text/javascript"></script>
</head>

<body class="container-fluid bg-body-secondary">

  <div class="row text-center">
    <h1>歌仔戲</h1>
  </div>

  <div id="opera-list" class="row">
    <!-- Opera list placeholder -->
  </div>

  <footer>
    <div class="text-center p-2" style="font-size: 16px">
      <span class="p-2">Created by Neil Chen in 2026.</span>
      <a href="https://www.linkedin.com/in/neil-chen-nc/" target="_blank"><img src="images/linkedin-icon.png"
          class="rounded p-1" alt="LinkedIn" /></a>
      <a href="https://github.com/neilchennc/taiwanese-opera/" target="_blank"><img src="images/github-icon.png"
          class="rounded p-1" alt="Github" /></a>
    </div>
  </footer>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>

  <script>
    const cell_width = 256;

    // Adding opera list
    operas.forEach((opera, index) => {
      $('#opera-list').append(`
        <div class="col-auto shadow-sm rounded border bg-white m-2 mb-4 p-0" style="width: ${cell_width}px;">
          <a href="${opera.list}" target="_blank">
            <img class="rounded-top" src="${opera.thumbnail}" alt="${opera.title}" width="${cell_width - 2}">
          </a>
          <h6 class="text-break m-1 px-1" style="width: ${cell_width}px;">${opera.title}</h6>
        </div>
      `);
    });
  </script>

  <!-- Live.js -->
  <!-- <script src="https://livejs.com/live.js"></script> -->
</body>

</html>
